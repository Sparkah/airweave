# docker-compose.yml
# Final Production Version for OneMind (Intel/AMD64)

services:
  postgres:
    container_name: airweave-db
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airweave}
      POSTGRES_USER: ${POSTGRES_USER:-airweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airweave1234!}
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airweave}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: airweave-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: airweave-backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "8001:8001"
    volumes:
      - ../backend:/app
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VESPA_URL=http://vespa
      - VESPA_PORT=8081
      # These two lines fix the ValueError crash
      - ENVIRONMENT=local
      - LOCAL_DEVELOPMENT=true
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_ENABLED=true
      - AUTH_ENABLED=false
      - API_FULL_URL=https://api.airweave.apiegames.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    container_name: airweave-frontend
    image: ghcr.io/airweave-ai/airweave-frontend:latest
    profiles:
      - frontend
    ports:
      - "8080:8080"
    volumes:
      - ./serve.json:/app/serve.json:ro
    environment:
      # Use the Public IP without a trailing slash for the script's validation
      - API_URL=https://api.airweave.apiegames.com #http://132.145.34.88:8001
      - ENABLE_AUTH=false
      # Use a simplified CSP that definitely includes your API
      # - "CONTENT_SECURITY_POLICY=default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://132.145.34.88:8001; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"
      - "CONTENT_SECURITY_POLICY=default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.airweave.apiegames.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"
    depends_on:
      - backend
    restart: on-failure

  qdrant:
    container_name: airweave-qdrant
    #platform: linux/amd64 # <-- Force Intel
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # Removed healthcheck to prevent "dependency failed" loop
    restart: on-failure

  temporal:
    container_name: airweave-temporal
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-airweave}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-airweave1234!}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal-config:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "ls", "/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: on-failure

  temporal-ui:
    container_name: airweave-temporal-ui
    image: temporalio/ui:2.26.2
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy
    restart: on-failure

  temporal-worker:
    container_name: airweave-temporal-worker
    image: ghcr.io/airweave-ai/airweave-backend:latest
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - TEXT2VEC_INFERENCE_URL=http://text2vec-transformers:8080
      - VESPA_URL=http://vespa
      - VESPA_PORT=8081
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - LOCAL_DEVELOPMENT=${LOCAL_DEVELOPMENT:-true}
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=airweave-sync-queue
      - TEMPORAL_ENABLED=true
    volumes:
      - ../backend:/app
    entrypoint: [ "python", "-m", "airweave.platform.temporal.worker" ]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: on-failure

  vespa:
    container_name: airweave-vespa
    image: vespaengine/vespa:8
    hostname: vespa
    ports:
      - "8081:8081"
      - "19071:19071"
    volumes:
      - vespa_data:/opt/vespa/var
      - ../vespa/app:/app
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:19071/state/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: on-failure

  vespa-init:
    container_name: airweave-vespa-init
    image: alpine:3.19
    volumes:
      - ../vespa/app:/app:ro
      - ../vespa/init-vespa.sh:/init-vespa.sh:ro
    entrypoint: [ "/bin/sh", "/init-vespa.sh" ]
    environment:
      - VESPA_CONFIG_SERVER=http://vespa:19071
    depends_on:
      vespa:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  vespa_data:
